<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayLaw - 再接続してください</title>
<style>
  body { margin: 0; background: #F3F0F5; color: #302936; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.65; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-family: 'Noto Serif JP', serif; font-weight: 600; font-size: 24px; line-height: 1.45; letter-spacing: 0.02em; margin: 0 0 16px; }
  p { margin: 0 0 12px; }
  button { height: 48px; padding: 0 24px; border: 0; border-radius: 4px; background: #59385F; color: #fff; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #754782; outline-offset: 3px; box-shadow: inset 0 0 0 2px #fff; }
  .mark { width: 40px; height: 40px; margin-bottom: 24px; }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" color="#59385F" aria-hidden="true"><path d="M20 85V15H65L80 30V45L65 60H20M49 60L82 85" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="miter"/><path d="M34 30V46" fill="none" stroke="currentColor" stroke-width="4"/></svg>
  <h1>再接続してください</h1>
  <p>ネットワークに接続できないため、画面を表示できません。RayLaw は機密データを端末に保存しないため、オフラインでは書類を表示・編集できません。</p>
  <p>接続が回復したら「再読み込み」を押してください。</p>
  <button type="button" onclick="location.reload()">再読み込み</button>
</main>
</body>
</html>
